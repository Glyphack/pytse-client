# Tools needed to work on pytse-client. Install them with `mise install`,
# then set up the virtualenv with `mise run install`.
[tools]
python = "3.15.2"
uv = "0.13.8"

[env]
# Let uv prefer the Python pinned above (on PATH through mise) over any
# uv-managed interpreter that may be installed on the machine.
UV_PYTHON_PREFERENCE = "system"

[tasks.install]
description = "Create the virtualenv with all dependencies"
run = "uv sync"

[tasks.test]
description = "Run the unit tests, offline on saved responses of the TSETMC API"
run = 'uv run pytest -m "not e2e"'

[tasks.e2e]
description = "Call every public API once with one symbol, with timings"
run = "uv run pytest -m e2e --durations=0 tests/test_e2e.py"

[tasks.check]
description = "Lint with ruff and type check with ty"
run = ["uv run ruff check", "uv run ty check"]

[tasks.build]
description = "Build the package"
run = "uv build"

[tasks.audit]
description = "Check the locked dependencies for known vulnerabilities"
run = "uv audit --preview-features audit-command"
