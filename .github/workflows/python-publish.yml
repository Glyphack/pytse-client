name: Upload Python Package
on:
  release:
    types: [created]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python and uv (versions from mise.toml)
        uses: jdx/mise-action@v5
        with:
          # Do not reuse caches in the release job.
          cache: false
      - name: Build
        run: uv build
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
