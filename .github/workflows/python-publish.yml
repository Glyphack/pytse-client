name: Upload Python Package
on:
  push:
    branches: [master]
    paths: [pyproject.toml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python and uv (versions from mise.toml)
        uses: jdx/mise-action@v5
        with:
          # Do not reuse caches in the release job.
          cache: false
      - name: Release the version of pyproject.toml when it has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          version=$(uv version --short)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "$tag is already released"
            exit 0
          fi
          uv build
          uv publish
          prerelease=false
          if [[ $version == *[a-z]* ]]; then
            prerelease=true
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --prerelease="$prerelease"
