# The full test suite. It calls the live TSETMC servers, so it does not run
# on push or pull request, start it by hand from the Actions tab ("Run
# workflow").
name: Unit Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python version that still gets updates.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up uv (version from mise.toml)
      uses: jdx/mise-action@v5
    - name: Install dependencies
      run: uv sync --locked
    - name: Run unit tests
      run: mise run test
